<svg viewBox="0 0 300 108" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="terminal sign-off sequence">
  <title>$ ./sign-off.sh</title>
  <style>
    .bg { fill: #fafafa; stroke: #e2ddd6; stroke-width: 1; }
    .ln { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; font-size: 14px; fill: #7e22ce; }
    .cursor { fill: #7e22ce; }
    .seq { animation: fade 10s linear infinite; }
    @keyframes fade { 0% { opacity: 1 } 88% { opacity: 1 } 91% { opacity: 0 } 100% { opacity: 0 } }
    #r1 { animation: r1 10s linear infinite; }
    @keyframes r1 { 0% { width: 0 } 8% { width: 150px } 100% { width: 150px } }
    #r2 { animation: r2 10s linear infinite; }
    @keyframes r2 { 0% { width: 0 } 9% { width: 0 } 18% { width: 159px } 100% { width: 159px } }
    #r3 { animation: r3 10s linear infinite; }
    @keyframes r3 { 0% { width: 0 } 20% { width: 0 } 33% { width: 213px } 100% { width: 213px } }
    #r4 { animation: r4 10s linear infinite; }
    @keyframes r4 { 0% { width: 0 } 35% { width: 0 } 47% { width: 195px } 100% { width: 195px } }
    .cursor { animation: blink 10s linear infinite; }
    @keyframes blink {
      0%, 50% { opacity: 0 }
      51%, 57% { opacity: 1 }
      58%, 64% { opacity: 0 }
      65%, 71% { opacity: 1 }
      72%, 78% { opacity: 0 }
      79%, 85% { opacity: 1 }
      86%, 100% { opacity: 0 }
    }
  </style>
  <rect class="bg" width="300" height="108" rx="8"/>
  <g class="seq">
    <clipPath id="c1"><rect id="r1" x="16" y="12" width="0" height="24"/></clipPath>
    <clipPath id="c2"><rect id="r2" x="16" y="34" width="0" height="24"/></clipPath>
    <clipPath id="c3"><rect id="r3" x="16" y="56" width="0" height="24"/></clipPath>
    <clipPath id="c4"><rect id="r4" x="16" y="78" width="0" height="24"/></clipPath>
    <text class="ln" x="16" y="28" clip-path="url(#c1)">$ ./sign-off.sh</text>
    <text class="ln" x="16" y="50" clip-path="url(#c2)">saving session...</text>
    <text class="ln" x="16" y="72" clip-path="url(#c3)">thanks for stopping by</text>
    <text class="ln" x="16" y="94" clip-path="url(#c4)">-&gt; ramon-de-wilde.dev</text>
    <rect class="cursor" x="211" y="82" width="8" height="14"/>
  </g>
</svg>
